spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    admin:
      fail-fast: false

management:
  health:
    redis:
      enabled: false   # Dev may run without Redis

server:
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.smartprocure: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
