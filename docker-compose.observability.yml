version: '3.8'
# =============================================================================
# SmartProcure – Observability Stack
# =============================================================================
# Usage (compose with main file):
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Dashboards: http://localhost:3001  (admin / admin123)
# Prometheus:  http://localhost:9090
# =============================================================================

services:

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: sp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - sp-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: sp-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - sp-network
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    container_name: sp-otel-collector
    ports:
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "8889:8889"    # Prometheus metrics exporter
    volumes:
      - ./docker/otel/otel-collector.yml:/etc/otel-collector.yml:ro
    command: ["--config=/etc/otel-collector.yml"]
    networks:
      - sp-network
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  sp-network:
    external: true
    name: sp-network
