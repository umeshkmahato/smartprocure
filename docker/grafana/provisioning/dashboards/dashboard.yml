apiVersion: 1

providers:
  - name: SmartProcure
    orgId: 1
    folder: SmartProcure
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
# Dashboard JSON files placed in /var/lib/grafana/dashboards are auto-loaded.
# Full SmartProcure procurement dashboard JSON is added in Phase 14 (Observability).
